<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ink tile -->
  <rect width="64" height="64" rx="14" fill="#1e1e1e"/>
  <!-- Grid dots -->
  <g fill="#4b4b4b">
    <circle cx="14" cy="14" r="1.4"/>
    <circle cx="32" cy="14" r="1.4"/>
    <circle cx="50" cy="14" r="1.4"/>
    <circle cx="14" cy="32" r="1.4"/>
    <circle cx="50" cy="32" r="1.4"/>
    <circle cx="14" cy="50" r="1.4"/>
    <circle cx="32" cy="50" r="1.4"/>
    <circle cx="50" cy="50" r="1.4"/>
  </g>
  <!-- Box -->
  <rect x="11" y="17" width="24" height="17" rx="2.5" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <!-- Ellipse -->
  <ellipse cx="42.5" cy="41" rx="12.5" ry="9.5" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <!-- Bound arrow -->
  <line x1="18" y1="50" x2="33" y2="33" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <polyline points="26,32 33,33 32,40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
