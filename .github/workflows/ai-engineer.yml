name: AI Engineer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-engineer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ai-agent:
    if: github.event.label.name == 'AI'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 1. Create branch (delete existing first) ──────────
      - name: Create branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ai/issue-${{ github.event.issue.number }}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

      # ── 2. Install Qwen Code CLI ──────────────────────────
      - name: Install Qwen Code
        run: npm install -g @qwen-code/qwen-code

      # ── 3. Configure Qwen Code model provider ─────────────
      #    The API key itself is passed as an env var in step 4;
      #    settings.json only declares the provider + model.
      - name: Configure Qwen Code
        run: |
          mkdir -p ~/.qwen
          cat > ~/.qwen/settings.json << 'EOF'
          {
            "$version": 4,
            "security": {
              "auth": {
                "selectedType": "openai"
              }
            },
            "model": {
              "name": "qwen3.8-max-preview",
              "baseUrl": "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
            },
            "modelProviders": {
              "openai": [
                {
                  "id": "qwen3.8-max-preview",
                  "name": "qwen3.8-max-preview",
                  "baseUrl": "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1",
                  "envKey": "BAILIAN_TOKEN_PLAN_API_KEY",
                  "generationConfig": {
                    "extra_body": { "enable_thinking": true },
                    "thinkingMandatory": true,
                    "contextWindowSize": 1000000,
                    "modalities": { "image": true, "video": true }
                  }
                }
              ]
            }
          }
          EOF

      # ── 4. Let Qwen solve the issue ───────────────────────
      - name: Solve issue
        env:
          BAILIAN_TOKEN_PLAN_API_KEY: ${{ secrets.BAILIAN_TOKEN_PLAN_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          qwen -p --output-format stream-json --approval-mode yolo \
            --append-system-prompt "Caveman mode full. Respond ultra-terse. Drop articles (a/an/the), filler (just/really/basically), pleasantries, hedging. Fragments OK. Short synonyms. No tool-call narration, no decorative tables/emoji. Technical terms exact. Code blocks unchanged. Errors quoted exact. Pattern: [thing] [action] [reason]. [next step]. This saves output tokens in CI." \
            "You are solving GitHub issue #${ISSUE_NUMBER}.

          Title: ${ISSUE_TITLE}

          Description:
          ${ISSUE_BODY}

          Instructions:
          - Follow all conventions in AGENTS.md
          - Make the necessary code changes
          - Run 'npm run build' to verify the build passes
          - If tests exist, run 'npm test' and make sure they pass
          - Do NOT commit — just leave the changes in the working tree
          - Also create a file 'screenshot-demo.mjs' in the project root:
            a standalone Node.js Playwright script that launches chromium,
            opens http://localhost:4173, exercises the feature you just
            implemented (draw shapes, click buttons, set colors, etc.),
            waits for the canvas to render, then saves a screenshot to
            'screenshot.png'. This script is for CI demo only — it will
            NOT be committed to the repo."

      # ── 5. Commit & push (exclude screenshot script) ──────
      - name: Commit and push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset HEAD screenshot-demo.mjs screenshot.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve #${ISSUE_NUMBER} — ${ISSUE_TITLE}"
          git push

      # ── 6. Screenshot with Playwright ─────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: Capture screenshot
        run: |
          npx vite preview --port 4173 &
          SERVER_PID=$!
          sleep 3

          if [ -f screenshot-demo.mjs ]; then
            node screenshot-demo.mjs
          else
            npx playwright screenshot \
              --viewport-size="1280,800" \
              --full-page \
              http://localhost:4173 \
              screenshot.png
          fi

          kill $SERVER_PID 2>/dev/null || true

      # ── 7. Create PR with screenshot ──────────────────────
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH: ai/issue-${{ github.event.issue.number }}
        run: |
          SCREENSHOT_SECTION=""
          if [ -f screenshot.png ]; then
            SCREENSHOT_URL=$(curl -s -F 'file=@screenshot.png' https://0x0.st)
            if [ -n "$SCREENSHOT_URL" ]; then
              SCREENSHOT_SECTION="

          ### Screenshot
          ![AI solution screenshot](${SCREENSHOT_URL})"
            fi
          fi

          gh pr create \
            --head "$BRANCH" \
            --title "fix: resolve #${ISSUE_NUMBER} — ${ISSUE_TITLE}" \
            --body "## Summary

          Automated fix for #${ISSUE_NUMBER}: **${ISSUE_TITLE}**

          Generated by AI Engineer workflow.
          ${SCREENSHOT_SECTION}

          Closes #${ISSUE_NUMBER}"
