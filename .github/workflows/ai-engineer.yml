name: AI Engineer

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-engineer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  qwen-agent:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'AI' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ai') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 1. Prepare branch ─────────────────────────────────
      #    issue label   → fresh ai/issue-N branch (delete existing first)
      #    /ai PR comment → continue on the existing PR branch
      - name: Prepare branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ai/issue-${{ github.event.issue.number }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            if ! git fetch origin "$BRANCH":"$BRANCH" 2>/dev/null; then
              echo "::error::Branch '$BRANCH' not found — the /ai command only works on PRs created by this workflow."
              exit 1
            fi
            git checkout "$BRANCH"
            git branch --set-upstream-to="origin/$BRANCH"
          else
            git push origin --delete "$BRANCH" 2>/dev/null || true
            git checkout -b "$BRANCH"
            git push -u origin "$BRANCH"
          fi

      # ── 2. Install Qwen Code CLI ──────────────────────────
      - name: Install Qwen Code
        run: npm install -g @qwen-code/qwen-code

      # ── 3. Configure Qwen Code model provider ─────────────
      #    The API key itself is passed as an env var in step 4;
      #    settings.json only declares the provider + model.
      - name: Configure Qwen Code
        run: |
          mkdir -p ~/.qwen
          cat > ~/.qwen/settings.json << 'EOF'
          {
            "$version": 4,
            "security": {
              "auth": {
                "selectedType": "openai"
              }
            },
            "model": {
              "name": "qwen3.8-max",
              "baseUrl": "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
            },
            "modelProviders": {
              "openai": [
                {
                  "id": "qwen3.8-max",
                  "name": "qwen3.8-max",
                  "baseUrl": "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1",
                  "envKey": "BAILIAN_TOKEN_PLAN_API_KEY",
                  "generationConfig": {
                    "extra_body": { "enable_thinking": true },
                    "thinkingMandatory": true,
                    "contextWindowSize": 1000000,
                    "modalities": { "image": true, "video": true }
                  }
                }
              ]
            }
          }
          EOF

      # ── 4. Install skills (reduce token usage) ────────────
      - name: Install caveman skill
        run: |
          mkdir -p ~/.qwen/skills/caveman
          curl -fsSL -o ~/.qwen/skills/caveman/SKILL.md \
            https://raw.githubusercontent.com/JuliusBrussee/caveman/main/skills/caveman/SKILL.md
          curl -fsSL -o ~/.qwen/skills/caveman/README.md \
            https://raw.githubusercontent.com/JuliusBrussee/caveman/main/skills/caveman/README.md

      - name: Install graphify skill
        run: |
          mkdir -p ~/.qwen/skills/graphify
          curl -fsSL -o ~/.qwen/skills/graphify/SKILL.md \
            https://raw.githubusercontent.com/Graphify-Labs/graphify/main/graphify/skill.md

      # ── 5. Build codebase knowledge graph ─────────────────
      - name: Install graphify
        run: pip install graphifyy -q --break-system-packages

      - name: Build knowledge graph
        run: |
          python3 -c "
          import json
          from graphify.extract import collect_files, extract
          from pathlib import Path

          code_files = collect_files(Path('.'))
          if code_files:
              result = extract(code_files)
              Path('graphify-out').mkdir(exist_ok=True)
              Path('graphify-out/graph.json').write_text(json.dumps(result, indent=2))
              print(f'Graph: {len(result[\"nodes\"])} nodes, {len(result[\"edges\"])} edges')
          else:
              print('No code files found')
          "

      # ── 6. Pre-install deps so the agent doesn't have to ──
      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ── 7. Let Qwen solve the issue / address feedback ────
      - name: Solve issue
        env:
          BAILIAN_TOKEN_PLAN_API_KEY: ${{ secrets.BAILIAN_TOKEN_PLAN_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          INSTRUCTIONS="Instructions:
          - Follow all conventions in AGENTS.md
          - Make the necessary code changes
          - node_modules and Playwright Chromium are ALREADY installed — do NOT run npm install, npm ci, or npx playwright install
          - Run 'npm run build' to verify the build passes
          - If tests exist, run 'npm test' and make sure they pass. Run the suite at most 3 times; after a failure re-run only the failing spec (e.g. 'npx playwright test tests/<file>.spec.ts') instead of the whole suite
          - Do NOT commit — just leave the changes in the working tree"

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            FEEDBACK="${COMMENT_BODY#/ai}"
            TASK="You are addressing review feedback on the pull request for GitHub issue #${ISSUE_NUMBER} (${ISSUE_TITLE}). The current implementation is already on this branch — build on it, do not start over.

          Review feedback:
          ${FEEDBACK}

          ${INSTRUCTIONS}"
          else
            TASK="You are solving GitHub issue #${ISSUE_NUMBER}.

          Title: ${ISSUE_TITLE}

          Description:
          ${ISSUE_BODY}

          ${INSTRUCTIONS}"
          fi

          qwen -p --output-format stream-json --approval-mode yolo \
            --append-system-prompt "Caveman mode full active. Use /caveman skill for all responses. A codebase knowledge graph exists at graphify-out/graph.json — use /graphify query to understand architecture before reading files. This saves tokens." \
            "$TASK"

      # ── 8. Commit & push ─────────────────────────────────
      - name: Commit and push
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset HEAD graphify-out/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            COMMIT_MSG="fix: address review feedback on #${ISSUE_NUMBER}"
          else
            COMMIT_MSG="fix: resolve #${ISSUE_NUMBER} — ${ISSUE_TITLE}"
          fi
          git commit -m "$COMMIT_MSG"
          git push

      # ── 9. Create PR (issue runs only; /ai runs push to the existing PR) ──
      - name: Create pull request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH: ai/issue-${{ github.event.issue.number }}
        run: |
          gh pr create \
            --head "$BRANCH" \
            --title "fix: resolve #${ISSUE_NUMBER} — ${ISSUE_TITLE}" \
            --body "## Summary

          Automated fix for #${ISSUE_NUMBER}: **${ISSUE_TITLE}**

          Generated by AI Engineer workflow.

          Closes #${ISSUE_NUMBER}"
